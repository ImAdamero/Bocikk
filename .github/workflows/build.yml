name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: rozpakuj
        run: |
          mkdir p
          unzip -q "$(ls *.zip | head -1)" -d p
      - name: build
        working-directory: p
        run: |
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: p/build/libs/
