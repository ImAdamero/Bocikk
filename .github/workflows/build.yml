name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: rozpakuj
        run: |
          ls
          mkdir p
          unzip -q EasyBot-projekt-yarn-1.21.11.zip -d p
      - name: build
        run: |
          ls -R p | head -40
          G=$(find p -name gradlew | head -1)
          cd "$(dirname "$G")"
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: p/**/build/libs/*.jar
